<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PharmEasy - Sign Up</title>
    <link rel="stylesheet" type="text/css" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">
                <img src="bg.jpg" alt="Pharmeasy Logo">
            </div>
            <div class="title">
                PharmEasy
            </div>
        </div>
        <div class="tagline">
            Pharmacy management made easy
        </div>
        <form>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>

            <label for="pharmacyname">Pharmacy Name:</label>
            <input type="text" id="pharmacyname" name="pharmacyname" required>

            <label for="username">Owner Name:</label>
            <input type="text" id="username" name="username" required>

            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required>

            <label for="confirm_password">Confirm Password:</label>
            <input type="password" id="confirm_password" name="confirm_password" required>

            <input type="button" value="Sign Up" onclick="signup()">
        </form>
    </div>

    <script>
        function signup() {
            // Retrieve user input
            const email = document.getElementById("email").value;
            const pharmacyname = document.getElementById("pharmacyname").value;
            const username = document.getElementById("username").value;
            const password = document.getElementById("password").value;
            const confirmPassword = document.getElementById("confirm_password").value;

            if (password !== confirmPassword) {
                alert("Passwords do not match");
                return;
            }

            // Check if user already exists
            const existingUsers = JSON.parse(localStorage.getItem("users")) || [];

            for (const user of existingUsers) {
                if (user.username === username) {
                    alert("Username already exists. Please choose a different one.");
                    return;
                }
            }

            // Create a new user
            const newUser = { email, pharmacyname, username, password };
            existingUsers.push(newUser);

            // Store users in local storage
            localStorage.setItem("users", JSON.stringify(existingUsers));

            // Redirect to a success page or login page
            alert("Registration successful. You can now sign in.");
            location.href = "SignIn.html"; // Check the filename and path
        }
    </script>
</body>
</html>
